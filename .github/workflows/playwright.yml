      - name: Notify Telegram of CI completion
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "🔄 Preparing Telegram notification..."

          # Ambil status jobs
          TEST_STATUS="${{ needs.test.result }}"
          DEPLOY_STATUS="${{ job.status }}"

          # Icon status per job
          if [ "$TEST_STATUS" == "success" ]; then
            TEST_ICON="✅"
          elif [ "$TEST_STATUS" == "failure" ]; then
            TEST_ICON="❌"
          else
            TEST_ICON="⚠️"
          fi

          if [ "$DEPLOY_STATUS" == "success" ]; then
            DEPLOY_ICON="✅"
          elif [ "$DEPLOY_STATUS" == "failure" ]; then
            DEPLOY_ICON="❌"
          else
            DEPLOY_ICON="⚠️"
          fi

          # Status pipeline keseluruhan
          if [ "$TEST_STATUS" == "success" ] && [ "$DEPLOY_STATUS" == "success" ]; then
            EMOJI="🎉"
            STATUS="Pipeline Passed"
          elif [ "$TEST_STATUS" == "failure" ]; then
            EMOJI="🚨"
            STATUS="Tests Failed"
          elif [ "$DEPLOY_STATUS" == "failure" ]; then
            EMOJI="🚨"
            STATUS="Deploy Failed"
          else
            EMOJI="⚠️"
            STATUS="Completed with Warnings"
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          REPORT_URL="https://suprimaaldino.github.io/cdcplaywrightlocator/"

          MESSAGE="$EMOJI *$STATUS*
          ━━━━━━━━━━━━━
          🧪 Tests: $TEST_ICON $TEST_STATUS
          📦 Deploy: $DEPLOY_ICON $DEPLOY_STATUS
          🕒 $TIMESTAMP
          🔖 \`$SHORT_SHA\`
          ━━━━━━━━━━━━━
          📈 [Test Report]($REPORT_URL)
          ⚡ [Lighthouse Audit]($REPORT_URL/lighthouse/lighthouse-report.html)
          🔄 [Workflow Run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"

          echo "📤 Sending message..."
          echo "$MESSAGE"

          RESPONSE=$(curl -s -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"$TELEGRAM_CHAT_ID\",
              \"text\": $(echo \"$MESSAGE\" | jq -R -s '.'),
              \"parse_mode\": \"Markdown\",
              \"disable_web_page_preview\": true
            }")

          if echo "$RESPONSE" | jq -e '.ok == true' >/dev/null; then
            echo "✅ Telegram notification sent!"
          else
            echo "❌ Failed to send Telegram notification"
            echo "Response: $RESPONSE"
          fi
